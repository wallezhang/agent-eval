name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-X main.version=${VERSION}"
          BINARY=agent-eval

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="${BINARY}-${VERSION}-${GOOS}-${GOARCH}"

            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi

            echo "Building ${output}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}" .
          done

          # Generate checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          changelog=""
          features=$(git log "$RANGE" --pretty=format:"%s" | grep -E "^feat(\(.+\))?:" | sed 's/^feat\([^)]*\): //' || true)
          fixes=$(git log "$RANGE" --pretty=format:"%s" | grep -E "^fix(\(.+\))?:" | sed 's/^fix\([^)]*\): //' || true)
          docs=$(git log "$RANGE" --pretty=format:"%s" | grep -E "^docs(\(.+\))?:" | sed 's/^docs\([^)]*\): //' || true)
          others=$(git log "$RANGE" --pretty=format:"%s" | grep -vE "^(feat|fix|docs|style|refactor|test|chore|ci|build)(\(.+\))?:" || true)

          if [ -n "$features" ]; then
            changelog+=$'\n## 🚀 New Features\n'
            while IFS= read -r line; do
              changelog+="- ${line}"$'\n'
            done <<< "$features"
          fi

          if [ -n "$fixes" ]; then
            changelog+=$'\n## 🐛 Bug Fixes\n'
            while IFS= read -r line; do
              changelog+="- ${line}"$'\n'
            done <<< "$fixes"
          fi

          if [ -n "$docs" ]; then
            changelog+=$'\n## 📖 Documentation\n'
            while IFS= read -r line; do
              changelog+="- ${line}"$'\n'
            done <<< "$docs"
          fi

          if [ -n "$others" ]; then
            changelog+=$'\n## Other Changes\n'
            while IFS= read -r line; do
              changelog+="- ${line}"$'\n'
            done <<< "$others"
          fi

          # Write to file for the release step
          echo "$changelog" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: dist/*
