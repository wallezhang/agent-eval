- id: water-formula
  name: "Chemical Formula of Water"
  tags: [chemistry, factual]
  input:
    prompt: "What is the chemical formula of water? Answer with the formula only."
  expected:
    text: "H2O"
  trials_per_task: 2
  graders:
    - type: exact_match
      weight: 0.6
      config:
        ignore_case: true
        ignore_whitespace: true
    - type: contains
      weight: 0.4
      config:
        ignore_case: true
        keywords: ["H2", "O"]

